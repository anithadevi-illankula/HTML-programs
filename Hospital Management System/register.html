<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - MediCare Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- ==========================================
         REGISTER PAGE
         ========================================== -->

    <main class="register-page">


        <div class="register-container">


            <!-- ==================================
                 HOSPITAL LOGO
                 ================================== -->

            <div class="register-logo">

                <h1>
                    MediCare Hospital
                </h1>


                <div class="register-logo-circle">

                    🏥

                </div>

            </div>


            <!-- ==================================
                 REGISTER CARD
                 ================================== -->

            <div class="register-card">


                <h2>
                    Create Account
                </h2>


                <p class="register-description">

                    Register to access the hospital management system.

                </p>


                <!-- ==================================
                     ERROR MESSAGE
                     ================================== -->

                {% if error %}

                <div class="register-error">

                    {{ error }}

                </div>

                {% endif %}


                <!-- ==================================
                     REGISTER FORM
                     ================================== -->

                <form method="POST"
                      action="/register">


                    <!-- Full Name -->

                    <div class="register-form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- Username -->

                    <div class="register-form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="register-form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <!-- Register Button -->

                    <button
                        type="submit"
                        class="register-button">

                        Create Account

                    </button>


                </form>


                <!-- ==================================
                     LOGIN LINK
                     ================================== -->

                <p class="login-text">

                    Already have an account?

                    <a href="/login">
                        Login here
                    </a>

                </p>


            </div>


        </div>


    </main>


</body>

</html>
