<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Patient - MediCare Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            MediCare Hospital
        </div>

        <div class="nav-links">

            <a href="/dashboard">Dashboard</a>

            <a href="/patients">Patients</a>

            <a href="/add-patient">Add Patient</a>

            <a href="/logout">Logout</a>

        </div>

    </nav>


    <main class="form-page">

        <div class="patient-form-card">

            <h1>Add New Patient</h1>

            <p>
                Enter patient information below.
            </p>


            <form method="POST">


                <label>Full Name</label>

                <input type="text"
                       name="fullname"
                       placeholder="Enter patient name"
                       required>


                <label>Age</label>

                <input type="number"
                       name="age"
                       placeholder="Enter age"
                       min="1"
                       max="120"
                       required>


                <label>Gender</label>

                <select name="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label>Phone</label>

                <input type="tel"
                       name="phone"
                       placeholder="Enter phone number"
                       required>


                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter email">


                <label>Address</label>

                <textarea name="address"
                          placeholder="Enter address"
                          rows="3"></textarea>


                <label>Disease / Health Issue</label>

                <input type="text"
                       name="disease"
                       placeholder="Enter disease"
                       required>


                <label>Doctor</label>

                <input type="text"
                       name="doctor"
                       placeholder="Enter doctor name"
                       required>


                <div class="form-buttons">

                    <button type="submit"
                            class="save-btn">

                        Save Patient

                    </button>

                    <a href="/patients"
                       class="cancel-btn">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </main>

</body>

</html>
