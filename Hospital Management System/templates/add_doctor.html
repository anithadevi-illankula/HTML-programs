<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Doctor - MediCare Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- ==========================================
         NAVBAR
         ========================================== -->

    <nav class="navbar">

        <div class="logo">
            MediCare Hospital
        </div>


        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/patients">
                Patients
            </a>

            <a href="/doctors">
                Doctors
            </a>

            <a href="#">
                Appointments
            </a>

            <a href="#">
                Pharmacy
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- ==========================================
         ADD DOCTOR FORM
         ========================================== -->

    <main class="doctor-form-page">


        <div class="doctor-form-card">


            <h1>
                Add New Doctor
            </h1>


            <p>
                Enter the doctor's professional and contact details.
            </p>


            <form method="POST">


                <div class="doctor-form-grid">


                    <!-- Doctor Name -->

                    <div class="doctor-form-group">

                        <label for="fullname">
                            Doctor Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter doctor name"
                            required>

                    </div>


                    <!-- Specialization -->

                    <div class="doctor-form-group">

                        <label for="specialization">
                            Specialization
                        </label>

                        <input
                            type="text"
                            id="specialization"
                            name="specialization"
                            placeholder="Example: Cardiologist"
                            required>

                    </div>


                    <!-- Department -->

                    <div class="doctor-form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            name="department"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="Cardiology">
                                Cardiology
                            </option>

                            <option value="Neurology">
                                Neurology
                            </option>

                            <option value="Orthopedics">
                                Orthopedics
                            </option>

                            <option value="Pediatrics">
                                Pediatrics
                            </option>

                            <option value="Dermatology">
                                Dermatology
                            </option>

                            <option value="General Medicine">
                                General Medicine
                            </option>

                            <option value="Gynecology">
                                Gynecology
                            </option>

                            <option value="ENT">
                                ENT
                            </option>

                            <option value="Dental">
                                Dental
                            </option>

                            <option value="Emergency">
                                Emergency
                            </option>

                        </select>

                    </div>


                    <!-- Phone -->

                    <div class="doctor-form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="doctor-form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address">

                    </div>


                    <!-- Experience -->

                    <div class="doctor-form-group">

                        <label for="experience">
                            Experience
                        </label>

                        <input
                            type="number"
                            id="experience"
                            name="experience"
                            placeholder="Years of experience"
                            min="0"
                            required>

                    </div>


                </div>


                <!-- ==================================
                     BUTTONS
                     ================================== -->

                <div class="doctor-form-buttons">


                    <button
                        type="submit"
                        class="doctor-save-btn">

                        Save Doctor

                    </button>


                    <a href="/doctors"
                       class="doctor-cancel-btn">

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </main>


</body>

</html>
