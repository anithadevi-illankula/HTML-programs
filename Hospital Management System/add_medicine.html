<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Medicine - MediCare Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        MediCare Hospital
    </div>

    <div class="nav-links">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/patients">
            Patients
        </a>

        <a href="/doctors">
            Doctors
        </a>

        <a href="/appointments">
            Appointments
        </a>

        <a href="/pharmacy" class="active">
            Pharmacy
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<!-- ================= ADD MEDICINE ================= -->

<main class="pharmacy-form-page">

    <div class="pharmacy-form-card">


        <h1>
            Add New Medicine
        </h1>


        <p>
            Enter medicine details and stock information.
        </p>


        <form method="POST">


            <div class="pharmacy-form-grid">


                <!-- MEDICINE NAME -->

                <div class="pharmacy-form-group">

                    <label for="name">
                        Medicine Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter medicine name"
                           required>

                </div>


                <!-- CATEGORY -->

                <div class="pharmacy-form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category"
                            name="category"
                            required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Tablet">
                            Tablet
                        </option>

                        <option value="Capsule">
                            Capsule
                        </option>

                        <option value="Syrup">
                            Syrup
                        </option>

                        <option value="Injection">
                            Injection
                        </option>

                        <option value="Cream">
                            Cream
                        </option>

                        <option value="Ointment">
                            Ointment
                        </option>

                        <option value="Drops">
                            Drops
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- MANUFACTURER -->

                <div class="pharmacy-form-group">

                    <label for="manufacturer">
                        Manufacturer
                    </label>

                    <input type="text"
                           id="manufacturer"
                           name="manufacturer"
                           placeholder="Enter manufacturer name">

                </div>


                <!-- QUANTITY -->

                <div class="pharmacy-form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           placeholder="Enter stock quantity"
                           min="0"
                           required>

                </div>


                <!-- PRICE -->

                <div class="pharmacy-form-group">

                    <label for="price">
                        Price
                    </label>

                    <input type="number"
                           id="price"
                           name="price"
                           placeholder="Enter medicine price"
                           min="0"
                           step="0.01"
                           required>

                </div>


                <!-- EXPIRY DATE -->

                <div class="pharmacy-form-group">

                    <label for="expiry_date">
                        Expiry Date
                    </label>

                    <input type="date"
                           id="expiry_date"
                           name="expiry_date"
                           required>

                </div>


                <!-- SUPPLIER -->

                <div class="pharmacy-form-group pharmacy-full-width">

                    <label for="supplier">
                        Supplier
                    </label>

                    <input type="text"
                           id="supplier"
                           name="supplier"
                           placeholder="Enter supplier name">

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="pharmacy-form-buttons">


                <button type="submit"
                        class="pharmacy-save-btn">

                    Save Medicine

                </button>


                <a href="/pharmacy"
                   class="pharmacy-cancel-btn">

                    Cancel

                </a>


            </div>


        </form>


    </div>

</main>


</body>

</html>
