<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor - MediCare Hospital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- ==========================================
         NAVBAR
         ========================================== -->

    <nav class="navbar">

        <div class="logo">
            MediCare Hospital
        </div>


        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/patients">
                Patients
            </a>

            <a href="/doctors">
                Doctors
            </a>

            <a href="#">
                Appointments
            </a>

            <a href="#">
                Pharmacy
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- ==========================================
         EDIT DOCTOR FORM
         ========================================== -->

    <main class="doctor-form-page">


        <div class="doctor-form-card">


            <h1>
                Edit Doctor
            </h1>


            <p>
                Update the doctor's professional and contact details.
            </p>


            <form method="POST">


                <div class="doctor-form-grid">


                    <!-- Doctor Name -->

                    <div class="doctor-form-group">

                        <label for="fullname">
                            Doctor Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            value="{{ doctor['fullname'] }}"
                            required>

                    </div>


                    <!-- Specialization -->

                    <div class="doctor-form-group">

                        <label for="specialization">
                            Specialization
                        </label>

                        <input
                            type="text"
                            id="specialization"
                            name="specialization"
                            value="{{ doctor['specialization'] }}"
                            required>

                    </div>


                    <!-- Department -->

                    <div class="doctor-form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            name="department"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="Cardiology"
                                {% if doctor['department'] == 'Cardiology' %}selected{% endif %}>
                                Cardiology
                            </option>

                            <option value="Neurology"
                                {% if doctor['department'] == 'Neurology' %}selected{% endif %}>
                                Neurology
                            </option>

                            <option value="Orthopedics"
                                {% if doctor['department'] == 'Orthopedics' %}selected{% endif %}>
                                Orthopedics
                            </option>

                            <option value="Pediatrics"
                                {% if doctor['department'] == 'Pediatrics' %}selected{% endif %}>
                                Pediatrics
                            </option>

                            <option value="Dermatology"
                                {% if doctor['department'] == 'Dermatology' %}selected{% endif %}>
                                Dermatology
                            </option>

                            <option value="General Medicine"
                                {% if doctor['department'] == 'General Medicine' %}selected{% endif %}>
                                General Medicine
                            </option>

                            <option value="Gynecology"
                                {% if doctor['department'] == 'Gynecology' %}selected{% endif %}>
                                Gynecology
                            </option>

                            <option value="ENT"
                                {% if doctor['department'] == 'ENT' %}selected{% endif %}>
                                ENT
                            </option>

                            <option value="Dental"
                                {% if doctor['department'] == 'Dental' %}selected{% endif %}>
                                Dental
                            </option>

                            <option value="Emergency"
                                {% if doctor['department'] == 'Emergency' %}selected{% endif %}>
                                Emergency
                            </option>

                        </select>

                    </div>


                    <!-- Phone -->

                    <div class="doctor-form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="{{ doctor['phone'] }}"
                            required>

                    </div>


                    <!-- Email -->

                    <div class="doctor-form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ doctor['email'] or '' }}">

                    </div>


                    <!-- Experience -->

                    <div class="doctor-form-group">

                        <label for="experience">
                            Experience
                        </label>

                        <input
                            type="number"
                            id="experience"
                            name="experience"
                            value="{{ doctor['experience'] }}"
                            min="0"
                            required>

                    </div>


                </div>


                <!-- ==================================
                     BUTTONS
                     ================================== -->

                <div class="doctor-form-buttons">


                    <button
                        type="submit"
                        class="doctor-save-btn">

                        Update Doctor

                    </button>


                    <a href="/doctors"
                       class="doctor-cancel-btn">

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </main>


</body>

</html>
